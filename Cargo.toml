[package]
name = "pail"
version = "0.1.0"
edition = "2024"
description = "A simple, serverless version control system stored in S3/GCS"

[dependencies]
anyhow = "1"
blake3 = "1.8"
bytes = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
fastcdc = "3"
fs2 = "0.4"
futures = "0.3"
globset = "0.4.20"
hex = "0.4"
ignore = "0.4"
libc = "0.2.191"
memmap2 = "0.9.11"
object_store = { version = "0.14", features = ["aws", "gcp"] }
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1_smol = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
url = "2"
zstd = "0.13"
