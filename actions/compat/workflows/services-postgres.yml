name: services-postgres
on: [pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: rust:1.80-bookworm
      env:
        RUST_BACKTRACE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --test integration
