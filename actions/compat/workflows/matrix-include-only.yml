name: matrix-include-only
on: [push]
jobs:
  target:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
          - runner: macos-latest
            triple: aarch64-apple-darwin
    steps:
      - run: cargo build --target ${{ matrix.triple }}
