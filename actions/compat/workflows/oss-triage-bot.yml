name: oss-triage-bot
# Issue and PR housekeeping: the events and actions that call the GitHub API.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]
  schedule:
    - cron: "30 1 * * *"
permissions:
  issues: write
  pull-requests: write
jobs:
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  welcome:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thanks for the report!'
            })
  stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
  slash-commands:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment ${{ github.event.issue.number }} --body "rebasing"
        env:
          GH_TOKEN: ${{ github.token }}
